    signingConfigs {
        release {
            // v6: persistent CI signing — keystore/passwords come from
            // GitHub Actions secrets (see .github/workflows/build.yml).
            // V6+ builds share one key and update in place. Absent
            // locally -> unsigned release build.
            def ksPath = System.getenv("PANTHEON_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile = file(ksPath)
                storePassword = System.getenv("PANTHEON_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("PANTHEON_KEY_ALIAS")
                keyPassword = System.getenv("PANTHEON_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // v6: full R8 shrink + resource shrink — the old 58MB debug APK
            // was the biggest reason the launcher felt broken on install.
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            signingConfig = signingConfigs.getByName("release")
        }
        debug {
            // Debug APK is what GitHub Actions uploads as the installable artifact.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

