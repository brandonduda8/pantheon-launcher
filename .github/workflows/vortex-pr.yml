name: Vortex PR checks

# Secrets-free verification for pull requests: unit tests, debug APK,
# API-34 emulator smoke. Never signs, publishes, or deploys.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortex-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vortex-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: pantheon-vortex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Same R8 release build the main smoke gate tests, signed with a
      # throwaway key generated here (not the production key; no secrets).
      - name: Build release APK (throwaway signing key)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-throwaway.p12" -storetype PKCS12 \
            -storepass ci-throwaway -keypass ci-throwaway -alias ci -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=PR CI throwaway"
          PANTHEON_KEYSTORE_PATH="$RUNNER_TEMP/ci-throwaway.p12" PANTHEON_KEYSTORE_PASSWORD=ci-throwaway \
          PANTHEON_KEY_ALIAS=ci PANTHEON_KEY_PASSWORD=ci-throwaway \
            gradle :app:assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API-34 emulator smoke (release APK, same settings as main gate)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: bash .github/workflows/smoke-test.sh app/build/outputs/apk/release/app-release.apk
