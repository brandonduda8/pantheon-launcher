name: Ember PR — debug build and unit tests

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ember-pr.yml"
      - "docs/EMBER-V0.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build without release signing secrets
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Attach debug APK when build succeeds
        uses: actions/upload-artifact@v4
        with:
          name: ember-companion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
