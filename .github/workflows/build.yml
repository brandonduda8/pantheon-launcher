# Build Pantheon Launcher — signed, shrunk release APK (v6+)
#
# No Gradle wrapper is checked in on purpose: the workflow installs a pinned
# Gradle (8.7) via gradle/actions/setup-gradle, so the build is reproducible
# without committing a wrapper jar.
#
# Persistent CI signing: the keystore is stored as base64 in the
# PANTHEON_KEYSTORE_B64 secret along with PANTHEON_KEYSTORE_PASSWORD,
# PANTHEON_KEY_ALIAS, and PANTHEON_KEY_PASSWORD. The first secret upload
# created the key that V6+ all share, so future builds update in place.
# (V5 used GitHub's ephemeral debug key and cannot be updated — V5 must be
# uninstalled before installing V6 once.)

name: Build release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore signing keystore
        run: |
          echo "$PANTHEON_KEYSTORE_B64" | base64 -d > /tmp/pantheon-release.p12
          echo "PANTHEON_KEYSTORE_PATH=/tmp/pantheon-release.p12" >> "$GITHUB_ENV"
        env:
          PANTHEON_KEYSTORE_B64: ${{ secrets.PANTHEON_KEYSTORE_B64 }}

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          PANTHEON_KEYSTORE_PASSWORD: ${{ secrets.PANTHEON_KEYSTORE_PASSWORD }}
          PANTHEON_KEY_ALIAS: ${{ secrets.PANTHEON_KEY_ALIAS }}
          PANTHEON_KEY_PASSWORD: ${{ secrets.PANTHEON_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-launcher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Emulator smoke test: Brandon's phone ANRs ("isn't responding") on the
  # release build, and we will never hand him another untested APK. This job
  # boots an API 34 (Android 14) emulator — his device's level — installs the
  # release APK, launches the launcher's main activity, waits, then fails on
  # any ANR or crash from our package. logcat is always uploaded.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pantheon-launcher-release
          path: apk

      - name: Emulator smoke test (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            set -u
            PKG=com.apexforge.godlauncher
            ls -la apk/
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell am start -n $PKG/.MainActivity
            echo "launched, waiting 45s for splash + home to settle..."
            sleep 45
            adb logcat -d > logcat.txt
            adb shell cat /data/anr/traces.txt > anr-traces.txt 2>/dev/null \
              || echo "no /data/anr/traces.txt" > anr-traces.txt
            echo "=== ANR / crash check ==="
            FAIL=0
            if grep -q "ANR in $PKG" logcat.txt; then
              echo "SMOKE_FAIL: ANR detected for $PKG"
              grep -B2 -A60 "ANR in $PKG" logcat.txt | head -120
              FAIL=1
            fi
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "SMOKE_FAIL: FATAL EXCEPTION in logcat"
              grep -B8 -A25 "FATAL EXCEPTION" logcat.txt | head -80
              FAIL=1
            fi
            if ! adb shell pidof $PKG > /dev/null 2>&1; then
              echo "SMOKE_FAIL: process $PKG not running after 45s"
              FAIL=1
            fi
            if [ "$FAIL" -ne 0 ]; then
              echo "=== ActivityManager / runtime lines ==="
              grep -E "ActivityManager|AndroidRuntime" logcat.txt | tail -40
            else
              echo "SMOKE_PASS: no ANR, no crash, process alive"
            fi
            exit $FAIL

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            logcat.txt
            anr-traces.txt
